# weight_decay_low.yaml
test_id: "reg_weight_decay_low"
description: "Low weight decay (weight_decay = 0.0001) with no dropout"

# Network architecture parameters
architecture:
  hidden_layers: [512, 256]
  activations: ["relu","relu"]
  dropout_rates: [0.0, 0.0]

# Data processing parameters
data:
  color_mode: "grayscale"
  batch_size: 128
  augmentation:
    random_affine: 
      enabled: true
      degrees: 10
      translate: [0, 0.1]
    random_rotation:
      enabled: false
    random_horizontal_flip:
      enabled: false
  normalization: [0.5, 0.5]

# Training configuration
training:
  optimizer:
    name: "adam"
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    name: "step_lr"
    step_size: 10
    gamma: 0.7
  epochs: 15
  early_stopping:
    enabled: false
    patience: 5