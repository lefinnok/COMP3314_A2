# combined_all.yaml
test_id: "combined_all"
description: "MLP configuration with all augmentation techniques enabled"

# Network architecture parameters
architecture:
  hidden_layers: [512, 256]
  activations: ["relu","relu"]
  dropout_rates: [0.5, 0.3]

# Data processing parameters
data:
  color_mode: "grayscale"
  batch_size: 128
  augmentation:
    random_affine: 
      enabled: true
      degrees: 10
      translate: [0, 0.1]
    random_rotation:
      enabled: true
      degrees: 15
    random_horizontal_flip:
      enabled: true
    color_jitter:
      enabled: true
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
    random_erasing:
      enabled: true
      probability: 0.5
      scale: [0.02, 0.33]
      ratio: [0.3, 3.3]
    gaussian_blur:
      enabled: true
      kernel_size: 5
      sigma: [0.1, 2.0]
    random_crop:
      enabled: true
      size: [32, 32]
      padding: 4
    random_perspective:
      enabled: true
      distortion_scale: 0.5
      probability: 0.5
  normalization: [0.5, 0.5]

# Training configuration
training:
  optimizer:
    name: "adam"
    learning_rate: 0.001
    weight_decay: 0.0
  scheduler:
    name: "step_lr"
    step_size: 10
    gamma: 0.7
  epochs: 15
  early_stopping:
    enabled: false
    patience: 5